args:
- description: Cortex XSIAM tenant API base URL (e.g. https://api-<tenant>.xdr.<region>.paloaltonetworks.com)
  name: api_url
  required: true
  supportedModules: []
- description: Cortex XSIAM API key value
  name: api_key
  required: true
  secret: true
  supportedModules: []
- description: Cortex XSIAM API key ID (integer, sent as the x-xdr-auth-id header)
  name: api_key_id
  required: true
  supportedModules: []
- description: Optional Cyberwatch integration instance name (leave empty if only one)
  name: cyberwatch_instance
  supportedModules: []
- description: Filter CVEs by Cyberwatch severity level
  name: level
  auto: PREDEFINED
  predefined:
  - level_low
  - level_medium
  - level_high
  - level_critical
  supportedModules: []
- description: Only import CVEs prioritized (or not) in Cyberwatch
  name: prioritized
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
  supportedModules: []
- description: Filter CVE announcements that are active
  name: active
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
  supportedModules: []
- description: Filter CVE announcements that are ignored
  name: ignored
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
  supportedModules: []
- description: Cyberwatch exploit_code_maturity filter
  name: exploit_code_maturity
  isArray: true
  supportedModules: []
- description: Cyberwatch CVSS access vector filter
  name: access_vector
  isArray: true
  supportedModules: []
- description: Filter CVEs by technology vendor (CPE)
  name: technology_vendor
  supportedModules: []
- description: Filter CVEs by technology product (CPE)
  name: technology_product
  supportedModules: []
- description: Only import CVEs whose last_modified >= this date. Accepts '3 days', '2025-01-01', or ISO 8601.
  name: since
  supportedModules: []
- description: Maximum CVEs to fetch from Cyberwatch
  name: hard_limit
  defaultValue: '500'
  supportedModules: []
- description: Cyberwatch pagination size
  name: per_page
  defaultValue: '500'
  supportedModules: []
- description: Number of assets per BYOS submit request
  name: batch_size
  defaultValue: '100'
  supportedModules: []
- description: If true, build the payload but do not POST to Cortex
  name: dry_run
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
  defaultValue: 'false'
  supportedModules: []
- description: Verify the Cortex API TLS certificate
  name: verify
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
  defaultValue: 'true'
  supportedModules: []
