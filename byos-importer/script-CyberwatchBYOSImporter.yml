script: |
  """
  Cyberwatch to Cortex XSIAM Exposure Management (Bring Your Own Scanner)

  XSIAM Automation Script.

  Flow
  ----
  1. Call the Cyberwatch integration command `cyberwatch-list-cves` with the
     supplied filters (level, prioritized, exploit maturity, per_page, hard_limit).
  2. For each returned CVE, call `cyberwatch-fetch-cve` to retrieve the affected
     servers (with hostname / os / updates / detected_at / prioritized).
  3. Aggregate by asset (one asset entry -> multiple CVE findings) into the
     BYOS payload shape.
  4. POST the payload in batches to
     `POST /public_api/vulnerability-management/v1/external-scans/assets`
     with the Cortex API key headers.
  5. Poll each returned job_id via
     `GET /public_api/vulnerability-management/v1/external-scans/assets/jobs/<id>`
     until a terminal job_status (COMPLETED, COMPLETED_WITH_ERRORS, FAILED)
     or the configured timeout is hit. Auto-polling is on by default and can
     be disabled with poll_after_submit=false.

  Standalone poll mode: pass `poll_job_id=<id>` and the script skips the whole
  Cyberwatch fetch/submit flow and just reports the current status of that
  job. Useful for a "check on this job" playbook step later on.

  The script returns the job ids emitted by the BYOS API, the polled status
  of each, and the number of assets and vulnerabilities submitted, so it can
  be chained inside a playbook.

  XSIAM API reference:
    https://docs-cortex.paloaltonetworks.com/r/Cortex-XSIAM-Platform-APIs/Submit-assets-and-vulnerabilities-from-an-external-scanner
    https://docs-cortex.paloaltonetworks.com/r/Cortex-XSIAM-Platform-APIs/Poll-the-status-of-a-BYOS-import-job
    https://docs-cortex.paloaltonetworks.com/r/Cortex-XSIAM-Platform-APIs/Bring-Your-Own-Scanner
  """
  from CommonServerPython import *  # noqa: F401,F403

  import json
  import time
  from datetime import datetime, timedelta, timezone
  from typing import Any


  VENDOR = "Cyberwatch"
  PRODUCT = "Vulnerability Manager"
  VERSION = "1.0"

  # Bumped every time the script's payload logic changes. Printed at startup
  # so we can tell from the war-room / logs which version XSIAM is running -
  # if you see an older value, delete the imported script and re-import.
  SCRIPT_VERSION = "1.3.0"

  BYOS_SUBMIT_PATH = "/public_api/vulnerability-management/v1/external-scans/assets"
  BYOS_JOB_PATH = "/public_api/vulnerability-management/v1/external-scans/assets/jobs"
  # Kept as an alias for backwards compat with anyone importing from the module.
  BYOS_PATH = BYOS_SUBMIT_PATH

  DEFAULT_BATCH_SIZE = 100
  DEFAULT_HARD_LIMIT = 500
  DEFAULT_PER_PAGE = 500

  # Terminal states for the BYOS import job (per Cortex XSIAM docs).
  TERMINAL_STATUSES = frozenset({"COMPLETED", "COMPLETED_WITH_ERRORS", "FAILED"})

  DEFAULT_POLL_TIMEOUT = 180   # seconds
  DEFAULT_POLL_INTERVAL = 5    # seconds between polls (backs off up to 30)

  # The BYOS API only accepts 'Potential' or 'Confirmed' for the `confidence`
  # field. Anything Cyberwatch actively surfaces on an asset is treated as
  # Confirmed; the only downgrade is when Cyberwatch itself has marked the
  # finding as `ignored`, in which case we send Potential.
  CONFIDENCE_CONFIRMED = "Confirmed"
  CONFIDENCE_POTENTIAL = "Potential"


  # ---------------------------------------------------------------------------
  # Cyberwatch calls
  # ---------------------------------------------------------------------------

  def _extract_context(results: list[dict], key: str) -> Any:
      """Pull an EntryContext value out of an executeCommand result list."""
      for entry in results:
          ctx = entry.get("EntryContext") or {}
          for k, v in ctx.items():
              # XSOAR keys look like "Cyberwatch.CVE(val.cve_code == obj.cve_code)"
              if k == key or k.startswith(f"{key}("):
                  return v
      return None


  def _raise_on_error(results: list[dict], command: str) -> None:
      for entry in results:
          if is_error(entry):
              err = get_error(entry)
              raise DemistoException(f"'{command}' failed: {err}")


  def list_cyberwatch_cves(instance: str | None, args: dict) -> list[dict]:
      exec_args = dict(args)
      if instance:
          exec_args["using"] = instance

      demisto.debug(f"Calling cyberwatch-list-cves with {exec_args}")
      results = demisto.executeCommand("cyberwatch-list-cves", exec_args)
      _raise_on_error(results, "cyberwatch-list-cves")

      cves = _extract_context(results, "Cyberwatch.CVE")
      if not cves:
          return []
      if isinstance(cves, dict):
          cves = [cves]
      return cves


  def fetch_cyberwatch_cve(instance: str | None, cve_code: str) -> dict | None:
      exec_args: dict[str, Any] = {"cve_code": cve_code}
      if instance:
          exec_args["using"] = instance

      demisto.debug(f"Calling cyberwatch-fetch-cve for {cve_code}")
      results = demisto.executeCommand("cyberwatch-fetch-cve", exec_args)
      _raise_on_error(results, "cyberwatch-fetch-cve")

      cve = _extract_context(results, "Cyberwatch.CVE")
      if isinstance(cve, list):
          cve = cve[0] if cve else None
      return cve


  # ---------------------------------------------------------------------------
  # Payload builders
  # ---------------------------------------------------------------------------

  def _to_unix_ts(iso_str: str | None) -> int:
      """Cyberwatch dates come as ISO 8601. BYOS wants seconds since epoch."""
      if not iso_str:
          return int(datetime.now(timezone.utc).timestamp())
      txt = str(iso_str).replace("Z", "+00:00")
      try:
          dt = datetime.fromisoformat(txt)
      except ValueError:
          return int(datetime.now(timezone.utc).timestamp())
      if dt.tzinfo is None:
          dt = dt.replace(tzinfo=timezone.utc)
      return int(dt.timestamp())


  def _confidence_from_server_entry(server_entry: dict) -> str:
      return CONFIDENCE_POTENTIAL if server_entry.get("ignored") else CONFIDENCE_CONFIRMED


  def _asset_key(server: dict) -> str:
      """Cyberwatch asset identity: prefer id, fallback to hostname."""
      if server.get("id"):
          return f"cyberwatch-server-{server['id']}"
      return f"cyberwatch-hostname-{server.get('hostname', 'unknown')}"


  def _build_asset_shell(server: dict, os_name: str | None, now_ts: int) -> dict:
      fqdns: list[str] = []
      if server.get("hostname"):
          fqdns.append(server["hostname"])
      return {
          "origin_asset_id": _asset_key(server),
          "asset_name": server.get("hostname") or _asset_key(server),
          "fqdn": fqdns,
          "os_name": os_name or (server.get("os") or {}).get("name"),
          "vendor": VENDOR,
          "product": (server.get("os") or {}).get("short_name") or PRODUCT,
          "version": (server.get("os") or {}).get("key") or "",
          # BYOS asset.last_seen must be a millisecond timestamp within the
          # last 100 days. We use "now" (sync moment) rather than Cyberwatch's
          # detected_at, which can be years old.
          "last_seen": now_ts,
          "origin_tags": [f"cyberwatch:server_id:{server.get('id')}"] if server.get("id") else [],
          "vulnerabilities": [],
      }


  def _build_vulnerability(cve: dict, server_entry: dict, now_ts: int) -> dict:
      cve_code = cve.get("cve_code")
      description = cve.get("content") or cve.get("description") or cve_code or ""
      return {
          "vulnerability_id": cve_code,
          "cve_id": [cve_code] if cve_code else [],
          "description": description[:1024],
          "confidence": _confidence_from_server_entry(server_entry),
          # BYOS vulnerability.last_seen must be a millisecond timestamp
          # within the last 30 days; use "now".
          "last_seen": now_ts,
          "raw_output": json.dumps({
              "score": cve.get("score"),
              "epss": cve.get("epss"),
              "level": cve.get("level"),
              "exploit_code_maturity": cve.get("exploit_code_maturity"),
              "environmental_score": server_entry.get("environmental_score"),
              "prioritized": server_entry.get("prioritized"),
              "ignored": server_entry.get("ignored"),
              "active": server_entry.get("active"),
              "updates": server_entry.get("updates"),
              "detected_at_source": server_entry.get("detected_at"),
          }, default=str)[:4000],
          "evidence": f"Detected by Cyberwatch on {server_entry.get('hostname') or 'unknown host'}",
          "scan_name": "Cyberwatch vulnerability scan",
      }


  def build_assets_from_cves(instance: str | None, list_cves: list[dict],
                             since_ts: int | None, now_ts: int) -> tuple[list[dict], int, int]:
      """
      For each CVE returned by list_cves, fetch its `servers[]` via fetch-cve and
      aggregate into a dict of assets. Returns (assets, cve_count, dropped_count).
      """
      assets_by_key: dict[str, dict] = {}
      dropped = 0
      considered = 0

      for cve_summary in list_cves:
          cve_code = cve_summary.get("cve_code")
          if not cve_code:
              continue
          if since_ts is not None:
              modified_ts = _to_unix_ts(cve_summary.get("last_modified"))
              if modified_ts < since_ts:
                  dropped += 1
                  continue

          considered += 1
          cve_full = fetch_cyberwatch_cve(instance, cve_code) or cve_summary

          servers = cve_full.get("servers") or []
          for server in servers:
              key = _asset_key(server)
              asset = assets_by_key.get(key)
              if asset is None:
                  asset = _build_asset_shell(server, (server.get("os") or {}).get("name"), now_ts)
                  assets_by_key[key] = asset
              asset["vulnerabilities"].append(_build_vulnerability(cve_full, server, now_ts))

      return list(assets_by_key.values()), considered, dropped


  # ---------------------------------------------------------------------------
  # BYOS submission
  # ---------------------------------------------------------------------------

  def _batched(items: list, size: int) -> list[list]:
      return [items[i:i + size] for i in range(0, len(items), size)]


  def submit_batch(base_url: str, api_key: str, api_key_id: str, verify: bool,
                   payload: dict) -> dict:
      """POST one BYOS batch to Cortex XSIAM and return the parsed response."""
      client = BaseClient(
          base_url=base_url.rstrip("/"),
          verify=verify,
          headers={
              "x-xdr-auth-id": str(api_key_id),
              "Authorization": api_key,
              "Content-Type": "application/json",
              "Accept": "application/json",
          },
      )

      response = client._http_request(
          method="POST",
          url_suffix=BYOS_SUBMIT_PATH,
          json_data=payload,
          resp_type="response",
          ok_codes=(200, 201, 202),
          timeout=120,
      )
      try:
          body = response.json()
      except Exception:
          body = {"raw": response.text}
      return body


  # ---------------------------------------------------------------------------
  # Polling
  # ---------------------------------------------------------------------------

  def _byos_client(base_url: str, api_key: str, api_key_id: str, verify: bool) -> "BaseClient":
      return BaseClient(
          base_url=base_url.rstrip("/"),
          verify=verify,
          headers={
              "x-xdr-auth-id": str(api_key_id),
              "Authorization": api_key,
              "Accept": "application/json",
          },
      )


  def poll_job(base_url: str, api_key: str, api_key_id: str, verify: bool,
               job_id: str, timeout: int = DEFAULT_POLL_TIMEOUT,
               interval: int = DEFAULT_POLL_INTERVAL) -> dict:
      """
      Poll GET /external-scans/assets/jobs/{job_id} until a terminal job_status
      (COMPLETED / COMPLETED_WITH_ERRORS / FAILED), a 404, or the timeout is hit.

      Returns the last response body enriched with poll metadata:
        poll_attempts, poll_elapsed_seconds, poll_timeout_hit (only if true).
      """
      client = _byos_client(base_url, api_key, api_key_id, verify)
      start = time.time()
      delay = max(1, interval)
      attempts = 0
      last_body: dict = {"job_id": job_id}

      while True:
          attempts += 1
          response = client._http_request(
              method="GET",
              url_suffix=f"{BYOS_JOB_PATH}/{job_id}",
              resp_type="response",
              ok_codes=(200, 404),
              timeout=30,
          )
          elapsed = int(time.time() - start)

          if response.status_code == 404:
              return {
                  "job_id": job_id,
                  "job_status": "NOT_FOUND",
                  "error_log": "Job not found by the BYOS API",
                  "poll_attempts": attempts,
                  "poll_elapsed_seconds": elapsed,
              }

          try:
              last_body = response.json() or {}
          except Exception:
              last_body = {"job_id": job_id, "raw": response.text}
          last_body.setdefault("job_id", job_id)

          status = str(last_body.get("job_status") or "").upper()
          demisto.debug(f"Poll {job_id} attempt={attempts} elapsed={elapsed}s status={status}")

          if status in TERMINAL_STATUSES:
              last_body["poll_attempts"] = attempts
              last_body["poll_elapsed_seconds"] = elapsed
              return last_body

          if elapsed >= timeout:
              last_body["poll_timeout_hit"] = True
              last_body["poll_attempts"] = attempts
              last_body["poll_elapsed_seconds"] = elapsed
              return last_body

          # Wait then back off (cap at 30s to stay responsive).
          remaining = timeout - elapsed
          sleep_for = min(delay, max(1, remaining))
          time.sleep(sleep_for)
          delay = min(int(delay * 1.5), 30)


  def _extract_job_id(response: dict | None) -> str | None:
      """The BYOS submit endpoint may return {job_id} or {reply: {job_id}}."""
      if not response:
          return None
      if response.get("job_id"):
          return response["job_id"]
      reply = response.get("reply") or {}
      return reply.get("job_id")


  # ---------------------------------------------------------------------------
  # Standalone poll-only mode
  # ---------------------------------------------------------------------------

  def _poll_only(args: dict) -> None:
      api_url = args.get("api_url")
      api_key = args.get("api_key")
      api_key_id = args.get("api_key_id")
      verify = _bool_arg(args.get("verify"), default=True)
      job_id = str(args.get("poll_job_id")).strip()
      timeout = int(args.get("poll_timeout") or DEFAULT_POLL_TIMEOUT)
      interval = int(args.get("poll_interval") or DEFAULT_POLL_INTERVAL)

      if not api_url or not api_key or not api_key_id:
          raise DemistoException(
              "'api_url', 'api_key' and 'api_key_id' are required to poll."
          )

      demisto.info(
          f"CyberwatchBYOSImporter v{SCRIPT_VERSION} poll-only mode: "
          f"job_id={job_id} timeout={timeout}s interval={interval}s"
      )
      result = poll_job(api_url, api_key, api_key_id, verify, job_id, timeout, interval)

      return_results(CommandResults(
          outputs_prefix="Cyberwatch.BYOS.Poll",
          outputs_key_field="job_id",
          outputs=result,
          readable_output=tableToMarkdown(
              f"BYOS job poll (importer v{SCRIPT_VERSION})",
              [{
                  "job_id": result.get("job_id"),
                  "job_status": result.get("job_status"),
                  "created_timestamp": result.get("created_timestamp"),
                  "last_updated": result.get("last_updated"),
                  "poll_attempts": result.get("poll_attempts"),
                  "poll_elapsed_seconds": result.get("poll_elapsed_seconds"),
                  "error_log": result.get("error_log"),
              }],
              ["job_id", "job_status", "created_timestamp", "last_updated",
               "poll_attempts", "poll_elapsed_seconds", "error_log"],
          ),
      ))


  def _parse_since(since: str | None) -> int | None:
      if not since:
          return None
      try:
          parsed = dateparser.parse(since)
      except Exception:  # pragma: no cover - dateparser is always available in XSOAR
          parsed = None
      if parsed is None:
          raise DemistoException(f"Invalid 'since' value: {since!r}")
      if parsed.tzinfo is None:
          parsed = parsed.replace(tzinfo=timezone.utc)
      return int(parsed.timestamp())


  # ---------------------------------------------------------------------------
  # Main
  # ---------------------------------------------------------------------------

  def _bool_arg(value, default=False) -> bool | None:
      if value is None or value == "":
          return default
      return str(value).lower() in ("true", "yes", "1")


  def main():
      args = demisto.args() or {}

      # Standalone poll mode: skip the whole Cyberwatch fetch/submit flow and
      # just report the status of an existing job.
      if args.get("poll_job_id"):
          _poll_only(args)
          return

      api_url = args.get("api_url")
      api_key = args.get("api_key")
      api_key_id = args.get("api_key_id")

      if not api_url or not api_key or not api_key_id:
          raise DemistoException(
              "'api_url', 'api_key' and 'api_key_id' are required (Cortex XSIAM API key + tenant URL)."
          )

      instance = args.get("cyberwatch_instance")
      verify = _bool_arg(args.get("verify"), default=True)
      batch_size = int(args.get("batch_size") or DEFAULT_BATCH_SIZE)
      dry_run = _bool_arg(args.get("dry_run"), default=False)
      poll_after_submit = _bool_arg(args.get("poll_after_submit"), default=True)
      poll_timeout = int(args.get("poll_timeout") or DEFAULT_POLL_TIMEOUT)
      poll_interval = int(args.get("poll_interval") or DEFAULT_POLL_INTERVAL)

      # Build the args passed to cyberwatch-list-cves
      cw_args: dict[str, Any] = {
          "per_page": args.get("per_page") or DEFAULT_PER_PAGE,
          "hard_limit": args.get("hard_limit") or DEFAULT_HARD_LIMIT,
      }
      for key in ("level", "prioritized", "active", "ignored",
                  "technology_vendor", "technology_product"):
          if args.get(key) not in (None, ""):
              cw_args[key] = args[key]
      for key in ("exploit_code_maturity", "access_vector", "groups"):
          if args.get(key) not in (None, ""):
              cw_args[f"{key}[]"] = args[key]

      since_ts = _parse_since(args.get("since"))
      # BYOS expects timestamps in milliseconds since epoch (Cortex convention,
      # same as the XDR API). Sending seconds is silently reinterpreted as a
      # date in 1970 and rejected with "older than 30 days".
      now_ts = int(time.time() * 1000)

      demisto.info(
          f"CyberwatchBYOSImporter version={SCRIPT_VERSION} starting - "
          f"now_ts={now_ts} (ms) since_ts={since_ts}"
      )
      demisto.info(f"Fetching CVEs from Cyberwatch with args={cw_args} since={since_ts}")
      list_cves = list_cyberwatch_cves(instance, cw_args)
      demisto.info(f"cyberwatch-list-cves returned {len(list_cves)} CVEs")

      if not list_cves:
          return_results(CommandResults(
              outputs_prefix="Cyberwatch.BYOS",
              outputs={"assets_count": 0, "vulnerabilities_count": 0, "jobs": []},
              readable_output="No CVEs returned by Cyberwatch - nothing to submit.",
          ))
          return

      assets, considered, dropped = build_assets_from_cves(instance, list_cves, since_ts, now_ts)
      vuln_count = sum(len(a["vulnerabilities"]) for a in assets)

      demisto.info(
          f"Prepared {len(assets)} assets / {vuln_count} vulnerabilities "
          f"({considered} CVEs considered, {dropped} dropped by 'since')"
      )

      if not assets:
          return_results(CommandResults(
              outputs_prefix="Cyberwatch.BYOS",
              outputs={
                  "assets_count": 0,
                  "vulnerabilities_count": 0,
                  "cves_considered": considered,
                  "cves_dropped_by_since": dropped,
                  "jobs": [],
              },
              readable_output=(
                  f"No assets built from {considered} CVEs. "
                  "Either no CVE has affected servers, or all were filtered out."
              ),
          ))
          return

      if dry_run:
          return_results(CommandResults(
              outputs_prefix="Cyberwatch.BYOS",
              outputs={
                  "assets_count": len(assets),
                  "vulnerabilities_count": vuln_count,
                  "cves_considered": considered,
                  "cves_dropped_by_since": dropped,
                  "sample_payload": {
                      "vendor": VENDOR, "product": PRODUCT, "version": VERSION,
                      "assets": assets[:2],
                  },
                  "jobs": [],
              },
              readable_output=(
                  f"[dry_run - importer v{SCRIPT_VERSION}] Would submit {len(assets)} "
                  f"assets / {vuln_count} vulnerabilities to Cortex XSIAM BYOS in "
                  f"batches of {batch_size}."
              ),
          ))
          return

      jobs: list[dict] = []
      for i, batch in enumerate(_batched(assets, batch_size), start=1):
          batch_vulns = sum(len(a["vulnerabilities"]) for a in batch)
          payload = {
              "vendor": VENDOR,
              "product": PRODUCT,
              "version": VERSION,
              "assets": batch,
          }
          demisto.info(f"Submitting batch {i}: {len(batch)} assets / {batch_vulns} vulnerabilities")
          response = submit_batch(api_url, api_key, api_key_id, verify, payload)
          job_id = _extract_job_id(response)
          jobs.append({
              "batch": i,
              "assets_in_batch": len(batch),
              "vulnerabilities_in_batch": batch_vulns,
              "job_id": job_id,
              "response": response,
          })

      # ---- Optional: poll each submitted job until it reaches a terminal state
      if poll_after_submit:
          demisto.info(
              f"Auto-polling {len(jobs)} job(s) with timeout={poll_timeout}s "
              f"interval={poll_interval}s (initial, backs off)"
          )
          for j in jobs:
              if not j.get("job_id"):
                  j["poll_result"] = {"job_status": "NO_JOB_ID_RETURNED"}
                  continue
              j["poll_result"] = poll_job(
                  api_url, api_key, api_key_id, verify,
                  j["job_id"], poll_timeout, poll_interval,
              )

      def _row(j: dict) -> dict:
          pr = j.get("poll_result") or {}
          return {
              "batch": j["batch"],
              "assets_in_batch": j["assets_in_batch"],
              "vulnerabilities_in_batch": j["vulnerabilities_in_batch"],
              "job_id": j.get("job_id"),
              "job_status": pr.get("job_status") or ("submitted" if not poll_after_submit else "unknown"),
              "poll_attempts": pr.get("poll_attempts"),
              "poll_elapsed_seconds": pr.get("poll_elapsed_seconds"),
              "error_log": pr.get("error_log"),
          }

      rows = [_row(j) for j in jobs]
      total_ok = sum(1 for r in rows if r["job_status"] == "COMPLETED")
      total_partial = sum(1 for r in rows if r["job_status"] == "COMPLETED_WITH_ERRORS")
      total_failed = sum(1 for r in rows if r["job_status"] == "FAILED")

      return_results(CommandResults(
          outputs_prefix="Cyberwatch.BYOS",
          outputs={
              "assets_count": len(assets),
              "vulnerabilities_count": vuln_count,
              "cves_considered": considered,
              "cves_dropped_by_since": dropped,
              "jobs": jobs,
              "poll_summary": {
                  "polled": poll_after_submit,
                  "total_jobs": len(jobs),
                  "completed": total_ok,
                  "completed_with_errors": total_partial,
                  "failed": total_failed,
              },
          },
          readable_output=tableToMarkdown(
              f"Cyberwatch -> Cortex XSIAM BYOS (importer v{SCRIPT_VERSION}, "
              f"{len(assets)} assets, {vuln_count} vulnerabilities, "
              f"{len(jobs)} job(s): {total_ok} completed, "
              f"{total_partial} with errors, {total_failed} failed)",
              rows,
              ["batch", "assets_in_batch", "vulnerabilities_in_batch", "job_id",
               "job_status", "poll_attempts", "poll_elapsed_seconds", "error_log"],
          ),
      ))


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()
