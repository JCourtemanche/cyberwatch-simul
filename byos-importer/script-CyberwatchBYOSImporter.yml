  type: number
- contextPath: Cyberwatch.BYOS.vulnerabilities_count
  description: Number of vulnerabilities submitted to BYOS
  type: number
- contextPath: Cyberwatch.BYOS.cves_considered
  description: CVEs kept after the 'since' filter
  type: number
- contextPath: Cyberwatch.BYOS.cves_dropped_by_since
  description: CVEs dropped because last_modified predates 'since'
  type: number
- contextPath: Cyberwatch.BYOS.jobs
  description: Per-batch submit responses, each enriched with poll_result if auto-poll ran
  type: unknown
- contextPath: Cyberwatch.BYOS.poll_summary
  description: Aggregate counts by terminal status across all polled jobs
  type: unknown
- contextPath: Cyberwatch.BYOS.Poll.job_id
  description: 'Standalone poll: job id being reported'
  type: string
- contextPath: Cyberwatch.BYOS.Poll.job_status
